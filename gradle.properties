# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.debug=false

# ---------------------------------------------------------------------------
# Gradle 8.x cannot run its daemon on Java 25 (it dies with
# "Unsupported class file major version 69" while compiling the build script).
# This machine's only JVMs were Java 25, so we pin the daemon to a real JDK 21.
# Temurin 21 is installed at ~/.jdks/temurin-21.0.12.1+1
#
# NOTE: this path is specific to this machine. If you share/copy this project
# elsewhere, delete this line (your IDE's own "Gradle JVM" setting takes over).
# ---------------------------------------------------------------------------
org.gradle.java.home=C\:\\Users\\senak\\.jdks\\temurin-21.0.12.1+1

# Parchment mappings - nicer parameter names while programming.
# Latest versions: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Bump this if you want a newer NeoForge 21.1.x build.
neo_version=21.1.176
neo_version_range=[21.1.0,)
loader_version_range=[4,)

